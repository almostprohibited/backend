name: Publish (release)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  STAGE: "release"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
  package-api:
    needs: [build]
    runs-on: ubuntu-24.04-arm
    if: github.repository == 'almostprohibited/backend'
    steps:
      - uses: actions/checkout@v6
      - name: Package API
        uses: ./.github/actions/package-api
        with:
          artifact-id: ${{ steps.build.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployment-stage: ${{ env.STAGE }}
  package-indexer:
    needs: [build]
    runs-on: ubuntu-24.04-arm
    if: github.repository == 'almostprohibited/backend'
    steps:
      - name: Package indexer
        uses: ./.github/actions/package-indexer
        with:
          artifact-id: ${{ steps.build.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployment-stage: ${{ env.STAGE }}
  package-chrome:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.repository == 'almostprohibited/backend'
    steps:
      - uses: actions/checkout@v6
      - name: Package Chrome
        uses: ./.github/actions/package-chrome
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  deploy:
    needs: [package-api, package-indexer, package-chrome]
    runs-on: self-hosted
    if: github.repository == 'almostprohibited/backend'
    steps:
      - uses: actions/checkout@v6
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployment-stage: ${{ env.STAGE }}
          docker-volume-path: ${{ vars.VOLUME_PATH }}
          env-file: ${{ secrets.ENV_RELEASE }}
          private-key: ${{ secrets.PRIVATE_KEY }}
