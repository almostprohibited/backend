[workspace]
resolver = "3"
members = [
	"crawler",
	"entrypoint",
	"retailers",
	"mongodb_connector",
	"common",
	"metrics"
]

[profile.release]
strip = true
opt-level = "s"
lto = true

[workspace.dependencies]
crawler = { path = "./crawler" }
retailers = { path = "./retailers" }
mongodb_connector = { path = "./mongodb_connector" }
common = { path = "./common" }
metrics = { path = "./metrics" }
discord = { path = "./discord" }
image_cache = { path = "./image_cache" }

reqwest = "0.13.1"
reqwest-retry = "0.9.0"
reqwest-middleware = "0.5.0"
serde = "1.0.228"
serde_json = "1.0.149"
serde_with = "3.16.1"
tokio = "1.49.0"
scraper = { version = "0.25.0", features = ["atomic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
async-trait = "0.1.88"
mongodb = "3.4.1"
axum = "0.8.8"
axum-extra = "0.12.5"
tower-http = "0.6.8"
tower = "0.5.3"
regex = "1.12.2"
thiserror = "2.0.17"
serenity = { version = "0.12.5", features = ["model"] }
urlencoding = "2.1.3"
strum = "0.27.1"
strum_macros = "0.27.1"
base64 = "0.22.1"
futures = "0.3.31"
openssl = { version = "0.10", features = ["vendored"] }
clap = { version = "4.5.54", features = ["derive"] }
mimalloc = "0.1.47"
chrono = "0.4.42"
opentelemetry = { version = "0.31.0", features = ["metrics"] }
opentelemetry-otlp = "0.31.0"
opentelemetry_sdk = "0.31.0"
lru = "0.16.3"
itertools = "0.14.0"
