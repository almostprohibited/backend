[workspace]
resolver = "3"
members = [
	"crawler",
	"entrypoint",
	"retailers",
	"mongodb_connector",
	"common",
	"metrics",
	"email",
	"semantic_matcher"
]

[profile.release]
strip = true
opt-level = "s"
lto = true

[workspace.dependencies]
crawler = { path = "./crawler" }
retailers = { path = "./retailers" }
mongodb_connector = { path = "./mongodb_connector" }
common = { path = "./common" }
metrics = { path = "./metrics" }
discord = { path = "./discord" }
image_cache = { path = "./image_cache" }
openid_connect = { path = "./openid_connect" }
email = { path = "./email" }
semantic_matcher = { path = "./semantic_matcher" }

reqwest = "0.13.4"
reqwest-retry = "0.9.1"
reqwest-middleware = "0.5.2"
serde = "1.0.228"
serde_json = "1.0.150"
serde_with = "3.20.0"
tokio = "1.52.2"
scraper = { version = "0.27.0", features = ["atomic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-trait = "0.1.88"
mongodb = "3.7.0"
axum = "0.8.9"
axum-extra = "0.12.6"
axum-otel-metrics = "0.14.1"
tower-http = "0.7.0"
tower = "0.5.3"
tower_governor = { version = "0.8.0", features = ["axum"] }
regex = "1.12.3"
thiserror = "2.0.18"
serenity = { version = "0.12.5", features = ["model"] }
urlencoding = "2.1.3"
strum = "0.28.0"
strum_macros = "0.28.0"
base64 = "0.22.1"
futures = "0.3.32"
openssl = { version = "0.10", features = ["vendored"] }
clap = { version = "4.6.1", features = ["derive"] }
mimalloc = "0.1.52"
chrono = "0.4.44"
# opentelemetry versions must be kept in tandem
opentelemetry = { version = "0.32.0", features = ["metrics"] }
opentelemetry-otlp = "0.32.0"
opentelemetry_sdk = "0.32.1"
lru = "0.18.0"
itertools = "0.15.0"
# note: don't use this library to do anything
# it's only here to solve site ground challenges
sha1 = "0.11.0"
openidconnect = { version = "4.0.1", features = ["reqwest"] }
rand = "0.10.1"
sha2 = "0.11.0"
lettre = { version = "0.11.22", features = ["tokio1", "tokio1-native-tls"] }
bm25 = { version = "2.3.2", features = ["parallelism"] }
csv = "1.4.0"
