name: Publish (beta)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  STAGE: "beta"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Build
        uses: ./.github/actions/build
  package:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.repository == 'almostprohibited/backend'
    steps:
      - uses: actions/checkout@v6
      - name: Package
        uses: ./.github/actions/package
        with:
          artifact-id: ${{ steps.build.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployment-stage: ${{ env.STAGE }}
  deploy:
    needs: [package]
    runs-on: self-hosted
    if: github.repository == 'almostprohibited/backend'
    steps:
      - uses: actions/checkout@v6
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployment-stage: ${{ env.STAGE }}
          docker-volume-path: ${{ vars.VOLUME_PATH }}
          env-file: ${{ secrets.ENV_BETA }}
