name: Publish (beta)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  STAGE: "beta"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/build
  package:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.repository == 'almostprohibited/backend'
    steps:
      - uses: actions/checkout@v4
      - name: Package
        uses: ./.github/actions/package
        with:
          artifact-id: ${{ steps.build.outputs.artifact-id }}
          toolbox-package-token: ${{ secrets.DEPLOYMENT_ACCESS }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployment-stage: ${{ env.STAGE }}
  deploy:
    needs: [package]
    runs-on: self-hosted
    if: github.repository == 'almostprohibited/backend'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: ./.github/actions/deploy
        with:
          toolbox-package-token: ${{ secrets.DEPLOYMENT_ACCESS }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deployment-stage: ${{ env.STAGE }}
          docker-volume-path: ${{ vars.VOLUME_PATH }}
          discord-contact-webhook-url: ${{ secrets.DISCORD_CONTACT_WEBHOOK_URL }}
          discord-indexer-webhook-url: ${{ secrets.DISCORD_INDEXER_WEBHOOK_URL }}
          cloudflare-turnstile-secret-key: ${{ secrets.CLOUDFLARE_TURNSTILE_SECRET_KEY }}
          proxy-address: ${{ secrets.PROXY_ADDRESS }}
          oidc-client-id-discord: ${{ secrets.OIDC_CLIENT_ID_DISCORD }}
          oidc-client-secret-discord: ${{ secrets.OIDC_CLIENT_SECRET_DISCORD }}
          oidc-client-id-google: ${{ secrets.OIDC_CLIENT_ID_GOOGLE }}
          oidc-client-secret-google: ${{ secrets.OIDC_CLIENT_SECRET_GOOGLE }}
