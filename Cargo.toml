[workspace]
resolver = "3"
members = [
	"crawler",
	"entrypoint",
	"retailers",
	"mongodb_connector",
	"common",
	"metrics"
]

[profile.release]
strip = true
opt-level = "s"
lto = true

[workspace.dependencies]
crawler = { path = "./crawler" }
retailers = { path = "./retailers" }
mongodb_connector = { path = "./mongodb_connector" }
common = { path = "./common" }
metrics = { path = "./metrics" }
discord = { path = "./discord" }
image_cache = { path = "./image_cache" }
openid_connect = { path = "./openid_connect" }

reqwest = "0.13.2"
reqwest-retry = "0.9.1"
reqwest-middleware = "0.5.1"
serde = "1.0.228"
serde_json = "1.0.149"
serde_with = "3.18.0"
tokio = "1.51.1"
scraper = { version = "0.26.0", features = ["atomic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
async-trait = "0.1.88"
mongodb = "3.5.1"
axum = "0.8.8"
axum-extra = "0.12.5"
tower-http = "0.6.8"
tower = "0.5.3"
regex = "1.12.3"
thiserror = "2.0.18"
serenity = { version = "0.12.5", features = ["model"] }
urlencoding = "2.1.3"
strum = "0.28.0"
strum_macros = "0.28.0"
base64 = "0.22.1"
futures = "0.3.32"
openssl = { version = "0.10", features = ["vendored"] }
clap = { version = "4.6.0", features = ["derive"] }
mimalloc = "0.1.47"
chrono = "0.4.44"
opentelemetry = { version = "0.31.0", features = ["metrics"] }
opentelemetry-otlp = "0.31.0"
opentelemetry_sdk = "0.31.0"
lru = "0.16.3"
itertools = "0.14.0"
# note: don't use this library to do anything
# it's only here to solve site ground challenges
sha1 = "0.11.0"
openidconnect = { version = "4.0.1", features = ["reqwest"] }
rand = "0.10.1"
sha2 = "0.11.0"
